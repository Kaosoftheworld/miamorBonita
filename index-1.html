<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Alecia</title>
    <style>
        /* 1. The Canvas: Black background for that deep, intimate feel */
        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        .portrait-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 4s ease-in; /* Smooth entrance */
        }

        .text-carving {
            /* 2. The Source: This pulls in your photo of Alecia */
            background: url('profile.png') no-repeat center;
            background-size: cover;
            
            /* 3. The Magic: This 'carves' the image into the poem */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; 
            
            /* Text styling to match your reference photos */
            font-size: 11px;
            font-weight: 900;
            line-height: 0.9;
            text-align: justify;
            letter-spacing: -1px;
            word-break: break-all;
            
            width: 100%;
            height: 100%;
            padding: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(1.1); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="portrait-container">
        <div class="text-carving" id="carving-effect"></div>
    </div>

    <script>
        // The custom poem for Alecia
        const poem = "Alecia, in the quiet curve of a silver shore, I find the grace I was looking for. Not in the sun, but the moon’s soft glow, mapping the secrets that the shadows know. Alecia, a galaxy rests in the depth of your eyes, where ancient stars and new hopes lie. Tracing the lines where the light meets the dark, every soft feature, a divine little spark. Alecia, it’s a beauty that speaks without making a sound, the kind of peace that is rarely found. Woven in ink and etched in the soul, the fragments of you, Alecia, that make the world whole. ";

        // Fills the screen with the poem to create her face
        document.getElementById('carving-effect').innerText = poem.repeat(800);
    </script>

</body>
</html>
