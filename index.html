<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
<title>For Alecia</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.portrait-wrapper {
    width: 100%;
    height: 100%;
    max-width: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.text-carving {
    width: 100%;
    height: 100%;
    padding: 12px;
    box-sizing: border-box;

    background: url('profile.png') no-repeat center center;
    background-size: contain;

    -webkit-background-clip: text;
    background-clip: text;
    color: rgba(255,255,255,0.92);

    font-family: "Times New Roman", serif;
    font-size: 12px;
    font-weight: bold;
    line-height: 0.95;
    text-align: justify;
    word-break: break-all;

    filter: grayscale(100%) contrast(1.9) brightness(1.15);

    text-shadow:
        0 0 1px rgba(0,0,0,0.6),
        0 0 0.8px rgba(255,255,255,0.1);

    image-rendering: auto;
    overflow: hidden;
}
</style>
</head>

<body>

<div class="portrait-wrapper">
    <div class="text-carving" id="carving"></div>
</div>

<script>
const poem = `Alecia, in the quiet curve of a silver shore, I find the grace I was looking for. 
Not in the sun, but the moon’s soft glow, mapping the secrets that the shadows know. 
Alecia, a galaxy rests in the depth of your eyes, where ancient stars and new hopes lie. 
Tracing the lines where the light meets the dark, every soft feature, a divine little spark. `;

document.getElementById("carving").innerText = poem.repeat(5000);
</script>

</body>
</html>
