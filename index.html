<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Alecia</title>
    <style>
        /* 1. THE DARKROOM */
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* This stops scrollbars during the zoom */
        }

        /* 2. THE FRAME */
        .portrait-wrapper {
            width: 100%;
            height: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. THE CARVING */
        .text-carving {
            /* IMAGE SOURCE */
            background-image: url('profile.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            
            /* MASKING MAGIC */
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; 
            -webkit-text-fill-color: transparent;
            
            /* FILTER */
            filter: grayscale(100%) contrast(1.5) brightness(2.0);
            
            /* TYPOGRAPHY */
            font-family: 'Times New Roman', serif;
            font-size: 11px; 
            font-weight: 900; 
            line-height: 0.9; 
            text-align: justify;
            word-break: break-all;
            
            /* LAYOUT */
            width: 100%;
            height: 100%;
            padding: 0;
            box-sizing: border-box;
            
            /* THE CINEMATIC ANIMATION */
            /* 5s duration, eases out smoothly, runs once */
            animation: zoomOutEffect 5s ease-out forwards;
        }

        /* 4. THE ANIMATION KEYFRAMES */
        @keyframes zoomOutEffect {
            0% {
                transform: scale(1.2); /* Starts zoomed in (120%) */
                opacity: 0; /* Starts invisible */
            }
            20% {
                opacity: 1; /* Fades in quickly while still zooming */
            }
            100% {
                transform: scale(1); /* Ends at normal full face (100%) */
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="portrait-wrapper">
        <div class="text-carving" id="carving-effect"></div>
    </div>

    <script>
        const poem = "Alecia, in the quiet curve of a silver shore, I find the grace I was looking for. Not in the sun, but the moon’s soft glow, mapping the secrets that the shadows know. Alecia, a galaxy rests in the depth of your eyes, where ancient stars and new hopes lie. Tracing the lines where the light meets the dark, every soft feature, a divine little spark. ";

        document.getElementById('carving-effect').innerText = poem.repeat(4000);
    </script>

</body>
</html>
