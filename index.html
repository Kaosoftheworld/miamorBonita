<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Alecia</title>
    <style>
        /* 1. THE DARKROOM */
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 2. THE FRAME */
        .portrait-wrapper {
            width: 100%;
            height: 100%;
            max-width: 600px; /* Keeps it portrait-shaped on PC */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. THE CARVING (Safeguarded) */
        .text-carving {
            /* IMAGE SOURCE - Split up for safety */
            background-image: url('profile.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; /* Forces image to fill the screen */
            
            /* THE MASKING MAGIC - Double enforcement */
            -webkit-background-clip: text;
            background-clip: text;
            
            /* TRANSPARENCY - This forces the text to disappear so the image shows through */
            color: transparent; 
            -webkit-text-fill-color: transparent;
            
            /* FILTER - High Contrast B&W to match your reference */
            filter: grayscale(100%) contrast(1.5) brightness(2.0);
            
            /* TYPOGRAPHY - The "Newspaper Art" Look */
            font-family: 'Times New Roman', serif;
            font-size: 11px; 
            font-weight: 900; 
            line-height: 0.9; 
            text-align: justify;
            word-break: break-all;
            
            /* LAYOUT */
            width: 100%;
            height: 100%;
            padding: 0; /* No padding so it touches the edges like the reference */
            box-sizing: border-box;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="portrait-wrapper">
        <div class="text-carving" id="carving-effect"></div>
    </div>

    <script>
        const poem = "Alecia, in the quiet curve of a silver shore, I find the grace I was looking for. Not in the sun, but the moon’s soft glow, mapping the secrets that the shadows know. Alecia, a galaxy rests in the depth of your eyes, where ancient stars and new hopes lie. Tracing the lines where the light meets the dark, every soft feature, a divine little spark. ";

        // High repetition for dense text
        document.getElementById('carving-effect').innerText = poem.repeat(4000);
    </script>

</body>
</html>
